[package]
categories = ["algorithms", "graphics", "mathematics"]
description = "Dyntopo real-time 3D sculpting in Rust"
edition = "2024"
exclude = ["examples/", "tests/", ".agents/", ".github/", ".zed/", ".idea/"]
keywords = ["3D", "mesh", "real-time", "sculpting", "topology"]
license = "MIT"
name = "freestyle-sculpt"
readme = "README.md"
repository = "https://github.com/Synphonyte/freestyle-sculpt"
version = "0.11.0"

[dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false, optional = true }
cfg-if = { version = "1", optional = true }
derive_more = { version = "2", features = ["deref", "deref_mut"] }
glam = "0.33"
hashbrown = "0.17"
itertools = "0.15"
lazy_static = { version = "1.5", optional = true }
mesh-graph = { version = "0.10" }
ordered-float = "5"
parry3d = "0.30"
rapier3d = { version = "0.35" }
rerun = { version = "0.36", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
slotmap = "1"
tracing = { version = "0.1", features = ["release_max_level_off"] }

[features]
bevy = ["dep:bevy", "mesh-graph/bevy"]
default = []
rerun = ["dep:cfg-if", "dep:lazy_static", "dep:rerun", "mesh-graph/rerun"]
serde = ["dep:serde", "glam/serde", "mesh-graph/serde"]
gltf = ["mesh-graph/gltf"]
# Debug-only: the mesh-graph op journal + state dump/resume harness used to hunt
# topology corruption. Never enable for a release build - it pulls in mesh-graph's
# per-op integrity validators and is very slow. Compiling the feature is inert on
# its own; `MESH_GRAPH_DANGLING_CHECK=1` arms the recording at runtime.
# `gltf` is required, not incidental: the replay harness that consumes the journal
# lives behind `all(feature = "gltf", feature = "serde")`, so without it
# `--features instrumentation` would silently compile out every test that uses this.
instrumentation = [
    "gltf",
    "mesh-graph/instrumentation",
    "serde",
]

[dev-dependencies]
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# mesh-graph 0.10 is not on crates.io yet; it is published right before this crate.
# RELEASE: comment this out again before `cargo publish` - the path does not exist in
# the packaged crate and publish verification fails while it is active.
[patch.crates-io]
mesh-graph.path = "../mesh-graph"
