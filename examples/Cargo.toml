[package]
name = "examples"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, optional = true }
freestyle-sculpt = { path = ".." }
mesh-graph = "0.8"
serde = { version = "1", features = ["derive"] }

[workspace]
resolver = "2"
members = ["bevy-basic-sculpt", "log-viewer"]

[workspace.dependencies]
examples = { path = "." }
freestyle-sculpt = { path = ".." }
glam = "0.33"
mesh-graph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
